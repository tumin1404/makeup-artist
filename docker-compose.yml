services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: makeup_app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-makeup_artist_db}
      DB_USERNAME: ${DB_USERNAME:-makeup_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
    volumes:
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - makeup_net

  db:
    image: mariadb:11.4
    container_name: makeup_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-makeup_artist_db}
      MYSQL_USER: ${DB_USERNAME:-makeup_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - makeup_net

  redis:
    image: redis:7-alpine
    container_name: makeup_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - makeup_net

volumes:
  db_data:
  redis_data:
  storage_data:

networks:
  makeup_net:
    driver: bridge
